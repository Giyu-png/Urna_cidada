name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIRESTORE_PROJECT_ID: demo-urna-cidada
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configurar Node.js para o Firebase Emulator
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools
      - name: Compilar, executar testes e validar Firestore no emulador
        run: firebase emulators:exec --only firestore --project demo-urna-cidada "mvn --batch-mode clean verify"
